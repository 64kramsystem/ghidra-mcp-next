[project]
name = "ghidra-mcp-bridge"
dynamic = ["version"]
description = "GhidraMCP-next bridge — a thin MCP↔HTTP multiplexer exposing Ghidra reverse-engineering tools to AI clients."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "xebyte" }]
keywords = ["ghidra", "mcp", "reverse-engineering", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp==1.28.1",
]

[project.scripts]
ghidra-mcp-bridge = "ghidra_mcp_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/64kramsystem/ghidra-mcp-next"
Repository = "https://github.com/64kramsystem/ghidra-mcp-next"
Changelog = "https://github.com/64kramsystem/ghidra-mcp-next/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "code"
path = "tools/bridge_version.py"
expression = "get_bridge_version()"

[tool.hatch.build.targets.wheel]
packages = ["python/ghidra_mcp_bridge"]

[tool.hatch.build.targets.sdist]
include = [
    "/python/ghidra_mcp_bridge",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/tools/bridge_version.py",
    "/pom.xml",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
dev = [{ include-group = "test" }]

[tool.pytest.ini_options]
minversion = "9.1"
addopts = """
-ra
-q
--strict-markers
--strict-config
--tb=short
--cov=ghidra_mcp_bridge
--cov-report=term-missing:skip-covered
"""
testpaths = ["tests/unit"]

[tool.uv]
package = true
cache-keys = [{ file = "pyproject.toml" }, { file = "pom.xml" }]
